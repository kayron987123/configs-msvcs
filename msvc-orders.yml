spring:
  data:
    redis:
      host: redis-msvc-orders
      port: 6381
      connect-timeout: 2000
      client-type: jedis
    mongodb:
      host: mongodb-msvc-orders
      port: 27017
      database: msvc-orders
      username: gad-dev
      password: 12345
      socket-timeout: 5000
      connect-timeout: 3000
      server-selection-timeout: 5000
    cache:
      type: redis

eureka:
  client:
    service-url:
      DefaultZone: http://eureka-server:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

server:
  port: 18033

rsa:
  key:
    public-key: 

custom:
  path: /api/v1

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-size: 5
        failure-rate-threshold: 30
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 50
        record-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException
    instances:
      updateOrderCircuitBreaker:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException
    instances:
      updateOrderRetry:
        base-config: default
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
    diskspace:
      enabled: true